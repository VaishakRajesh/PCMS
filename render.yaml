# Render Blueprint — one-click Docker deploy (Next.js standalone).
# Usage: push this repo to GitHub, then in Render: New -> Blueprint -> pick repo.
# Or: New -> Web Service -> pick repo -> Runtime: Docker -> Dockerfile: ./Dockerfile
services:
  - type: web
    name: pcms
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # Render sets PORT automatically; standalone server.js reads PORT + HOSTNAME env.
    # Health check hits the landing page (always public, always fast).
    healthCheckPath: /
    envVars:
      # Signs login cookies (required — do NOT keep the dev default in prod).
      - key: SESSION_SECRET
        generateValue: true
    # Optional persistence (needs a PAID disk — Free storage is ephemeral,
    # so portfolios reset on every redeploy/restart):
    # Render dashboard -> Disks -> add disks mounted at /app/data AND
    # /app/public/uploads (both are Dockerfile VOLUMEs).
